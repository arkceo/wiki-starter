<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Upload &amp; Logs</title>
<style>
  :root {
    --bg: #faf8f8; --panel: #ffffff; --text: #2b2b2b; --muted: #6b6b6b; --line: #e3e1e1;
    --accent: #284b63; --accent-soft: #e6eef3; --ok: #2e7d4f; --warn: #a86400; --bad: #b3261e;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161618; --panel: #1f1f22; --text: #ebebec; --muted: #a3a3a8; --line: #33333a;
      --accent: #84a59d; --accent-soft: #24302d; --ok: #6cc28f; --warn: #e0a54b; --bad: #f08b84;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161618; --panel: #1f1f22; --text: #ebebec; --muted: #a3a3a8; --line: #33333a;
    --accent: #84a59d; --accent-soft: #24302d; --ok: #6cc28f; --warn: #e0a54b; --bad: #f08b84;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 60rem; margin: 0 auto; padding: 1.5rem 16px 4rem; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  h1 { font-size: 1.6rem; margin: 0; }
  h2 { font-size: 1.05rem; margin: 2rem 0 0.6rem; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  #drop { margin-top: 1.25rem; border: 2px dashed var(--line); border-radius: 12px; background: var(--panel);
          padding: 2.25rem 1rem; text-align: center; transition: border-color .15s, background .15s; }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop strong { display: block; font-size: 1.15rem; margin-bottom: .35rem; }
  .buttons { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
  button, .btn { font: inherit; font-weight: 600; border-radius: 8px; padding: .5rem .95rem; cursor: pointer;
                 border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  .bar-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
             margin-top: 1.25rem; padding: .75rem 1rem; background: var(--panel); border: 1px solid var(--line);
             border-radius: 10px; }
  #state::before { content: ""; display: inline-block; width: .6rem; height: .6rem; border-radius: 50%;
                   margin-right: .45rem; background: var(--muted); vertical-align: middle; }
  #state.busy::before { background: var(--warn); animation: pulse 1.2s infinite; }
  #state.idle::before { background: var(--ok); }
  @keyframes pulse { 50% { opacity: .3; } }
  .overall { flex: 1 1 14rem; min-width: 0; }
  /* Two tones, like a video's buffered and played: light = converted, solid = done. */
  .meter { position: relative; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: .3rem; }
  .meter > span { position: absolute; inset: 0 auto 0 0; width: 0; transition: width .3s; }
  .meter > .buf { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-soft); }
  .meter > .fill { background: var(--accent); }
  .meter.done > .fill { background: var(--ok); }
  /* The live line: what the computer is doing at this moment. */
  #now { margin-top: .45rem; font-size: .9rem; min-height: 1.4em; overflow-wrap: anywhere; }
  #now .glyph { display: inline-block; width: 1.1em; color: var(--warn); font-family: var(--mono); }
  #now .verb { color: var(--accent); font-weight: 600; }
  #now .obj { font-weight: 600; }
  #now .paren { color: var(--muted); }
  #now:empty { display: none; }
  #files { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px;
           background: var(--panel); }
  #files:empty::before { content: "Nothing uploaded yet."; display: block; padding: .9rem 1rem; color: var(--muted); }
  #summary:not(:empty)::before { content: "· "; }
  #files li { padding: .75rem 1rem; border-top: 1px solid var(--line); }
  #files li:first-child { border-top: 0; }
  .file-head { display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
  .file-name { font-weight: 600; word-break: break-word; }
  .stage { font-size: .88rem; white-space: nowrap; }
  .stage.ok { color: var(--ok); } .stage.warn { color: var(--warn); } .stage.bad { color: var(--bad); }
  /* One segment per real stage. Solid = finished; shimmering = happening now; a partial
     fill only where the progress is measured (upload bytes). Waiting is not a stage. */
  .steps { display: flex; gap: .25rem; margin-top: .45rem; }
  .steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
  .steps span.on { background: var(--accent); }
  .steps.done span.on { background: var(--ok); }
  .steps.warn span.on { background: var(--warn); }
  .steps.bad span.on { background: var(--bad); }
  .steps span > i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
  .steps span.active::after { content: ""; position: absolute; inset: 0; animation: shimmer 1.3s linear infinite;
    background: linear-gradient(90deg, transparent 0%, var(--accent) 45%, var(--accent) 55%, transparent 100%);
    background-size: 50% 100%; background-repeat: no-repeat; }
  @keyframes shimmer { from { background-position: -50% 0; } to { background-position: 150% 0; } }
  #files li.legend { display: flex; gap: .25rem; padding: .45rem 1rem; font-size: .75rem; color: var(--muted); }
  #files li.legend span { flex: 1; }
  @media (prefers-reduced-motion: reduce) {
    .steps span.active::after { animation: none; background: var(--accent); opacity: .45; background-size: 100% 100%; }
    #state.busy::before { animation: none; }
  }
  .detail { font-size: .86rem; color: var(--muted); margin-top: .35rem; word-break: break-word; }
  .detail a { margin-right: .6rem; }
  #log { margin: 0; padding: .75rem 1rem; height: 22rem; overflow: auto; border: 1px solid var(--line);
         border-radius: 10px; background: var(--panel); font: 12.5px/1.55 var(--mono); white-space: pre-wrap; }
  #log .t { color: var(--muted); }
  #log .bad { color: var(--bad); } #log .ok { color: var(--ok); } #log .warn { color: var(--warn); }
  #log .old { opacity: .6; }
  #log .divider { color: var(--muted); border-top: 1px dashed var(--line); margin: .4rem 0; padding-top: .2rem; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Upload &amp; Logs</h1>
    <a href="/" id="back">← Back to the wiki</a>
  </header>
  <p class="muted" id="intro">Drop documents (PDF, Word, Excel, PowerPoint, scans, photos) to turn them into wiki
    pages, or Update Packets (<code>.md</code>) to update pages. Everything stays on this Mac.</p>

  <section id="drop" aria-label="Drop files here">
    <strong>Drop files or folders here</strong>
    <span class="muted" id="limit"></span>
    <div class="buttons">
      <button type="button" id="pick">Choose files</button>
      <button type="button" class="secondary" id="pick-folder">Choose a folder</button>
    </div>
    <input type="file" id="file-input" multiple>
    <input type="file" id="folder-input" webkitdirectory multiple>
  </section>

  <div class="bar-row">
    <div class="overall">
      <div><span id="state">Checking…</span> <span class="muted" id="summary"></span></div>
      <div class="meter" id="overall-meter" title="Light: converted to text. Solid: done.">
        <span class="buf"></span><span class="fill"></span></div>
      <div id="now" aria-live="off"></div>
    </div>
    <button type="button" class="secondary" id="process">Process now</button>
  </div>

  <h2>Files</h2>
  <ul id="files" aria-live="polite"></ul>

  <h2>Live log</h2>
  <pre id="log" aria-live="polite"></pre>
</main>

<script>
(() => {
  "use strict"
  const BOOT = __WIKI_BOOT__
  const TOKEN = BOOT.token
  const SITE = BOOT.site || ""    // the wiki itself is another origin (another port)
  document.getElementById("back").href = SITE + "/"
  let maxBytes = 500 * 1048576
  try {
    const saved = localStorage.getItem("theme")
    if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved)
  } catch (_) {}
  document.title = "Upload & Logs · " + BOOT.title

  const $ = (id) => document.getElementById(id)
  const filesEl = $("files"), logEl = $("log"), nowEl = $("now")
  const rows = new Map()          // queue path (or temporary upload id) -> row state
  const order = []
  let uploading = 0
  let currentRun = ""
  let runner = { running: false, since: "" }
  let now = {}                    // what the engine is doing at this moment (now.json)
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches
  // Events written before this page opened are history: shown dimmed, above a divider.
  const openedAt = Date.now() - 2000
  let dividerShown = false

  // The real stages a file goes through. Waiting is a label, never a stage, so a bar only
  // moves when work has actually been done.
  const DOC_STAGES = ["Upload", "Convert", "Read & write", "File"]
  const PACKET_STAGES = ["Upload", "Read", "Apply"]
  // state -> [stages finished, stage happening now (-1: none)]
  const PLACE = {
    doc: { uploading: [0, 0], queued: [1, -1], "waiting-convert": [1, -1], converting: [1, 1], ocr: [1, 1],
           converted: [2, -1], reading: [2, 2], filing: [3, 3], filed: [4, -1] },
    packet: { uploading: [0, 0], queued: [1, -1], reading: [1, 1], applying: [2, 2], applied: [3, -1] },
  }
  const RANK = { uploading: 0, queued: 1, "waiting-convert": 2, converting: 3, ocr: 3, converted: 4,
                 reading: 5, applying: 6, filing: 6, filed: 7, applied: 7 }
  const FINAL = { filed: "ok", applied: "ok", parked: "warn", failed: "bad", skipped: "muted", duplicate: "muted" }

  // The live line, in the spirit of a terminal spinner: a verb that keeps changing, always
  // one that fits the step, and in brackets the plain facts of what is being done.
  const POOLS = {
    settle: ["Letting the files settle", "Waiting for the copying to finish"],
    convert: ["Unfolding", "Unpacking", "Transcribing", "Decanting"],
    ocr: ["Squinting at", "Deciphering", "Peering at", "Making out the letters in"],
    load: ["Waking the model", "Warming up the model", "Stretching the model's legs"],
    read: ["Reading", "Digesting", "Leafing through", "Poring over"],
    ask: ["Noodling over", "Mulling over", "Pondering", "Chewing on", "Ruminating on"],
    check: ["Cross-checking", "Comparing notes on", "Double-checking"],
    write: ["Caramelising", "Weaving", "Stitching", "Simmering", "Drafting"],
    search: ["Rummaging through the wiki", "Looking things up", "Cross-referencing"],
    file: ["Tucking away", "Shelving", "Filing"],
    apply: ["Folding in", "Stirring in", "Applying"],
    think: ["Noodling", "Percolating", "Marinating", "Mulling it over"],
    tidy: ["Tidying up", "Sweeping up", "Straightening the edges"],
    commit: ["Saving a version", "Committing it to memory"],
    build: ["Plating up the website", "Polishing the pages", "Setting the table"],
  }
  const WITH_FILE = new Set(["convert", "ocr", "read", "ask", "check", "write", "file", "apply"])
  const GLYPHS = ["·", "✢", "✳", "✶", "✻", "✽", "✻", "✶", "✳", "✢"]

  const base = (p) => (p || "").split("/").pop()
  // A long name keeps its start and its end (the extension), so the facts after it fit.
  const shortName = (s) => s.length > 44 ? s.slice(0, 26) + "…" + s.slice(-15) : s
  const fmtSize = (n) => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(0) + " KB" : (n / 1048576).toFixed(1) + " MB"
  const fmtTokens = (n) => n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n)
  const fmtElapsed = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000))
    if (s < 60) return s + "s"
    const m = Math.floor(s / 60)
    if (m < 60) return m + "m " + String(s % 60).padStart(2, "0") + "s"
    return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"
  }
  const when = (t) => { const ms = t ? Date.parse(t) : NaN; return isNaN(ms) ? Date.now() : ms }
  const pageUrl = (p) => SITE + "/" + p.replace(/^wiki\//, "").replace(/\.md$/, "").replace(/(^|\/)index$/, "$1")
    .split("/").map((s) => encodeURIComponent(s.replace(/ /g, "-"))).join("/")
  const rawUrl = (p) => SITE + "/" + p.split("/").map(encodeURIComponent).join("/")
  const isPacketPath = (p) => (p || "").startsWith("raw/inbox/") || (p || "").startsWith("archive/inbox/")

  function row(key, name) {
    let r = rows.get(key)
    if (!r) {
      r = { key, name: name || base(key), size: 0, kind: isPacketPath(key) ? "packet" : "doc", state: "queued",
            pct: 0, since: 0, pages: 0, written: new Set(), links: [], to: "", note: "", final: "", retry: false, run: "" }
      rows.set(key, r)
      order.unshift(key)
    }
    return r
  }
  function rekey(oldKey, newKey) {
    const r = rows.get(oldKey)
    if (!r || oldKey === newKey) return r
    rows.delete(oldKey)
    if (rows.has(newKey)) { const i = order.indexOf(oldKey); if (i >= 0) order.splice(i, 1); return rows.get(newKey) }
    r.key = newKey
    r.kind = isPacketPath(newKey) ? "packet" : "doc"
    rows.set(newKey, r)
    order[order.indexOf(oldKey)] = newKey
    return r
  }
  // Move a file forward to a state; never backwards (events can repeat or arrive late).
  function setState(r, state, t, force) {
    if (!r || (r.final && !force)) return
    if (!force && (RANK[state] ?? 0) < (RANK[r.state] ?? 0)) return
    if (state !== r.state) r.since = when(t)
    r.state = state
    if (state !== "queued" && state !== "waiting-convert") r.retry = false
  }
  function finish(r, final, t) {
    r.final = final
    r.retry = false
    if (final === "filed" || final === "applied") r.state = final
    r.since = when(t)
  }

  // ------------------------------------------------------------------ labels
  const ago = (r) => r.since ? " · " + fmtElapsed(Date.now() - r.since) : ""
  function rowLabel(r) {
    if (r.final) return { filed: "Filed", applied: "Applied", parked: "Needs review", failed: "Upload failed",
                          skipped: "Skipped", duplicate: "Already queued" }[r.final] || r.final
    if (r.retry) return "Will retry"
    switch (r.state) {
      case "uploading": return `Uploading ${r.pct}%`
      case "queued": return r.kind === "packet" && r.run ? "Waiting its turn" : "Queued"
      case "waiting-convert": return "Waiting to convert"
      case "converting": return "Converting to text" + ago(r)
      case "ocr": return `OCR · ${r.pages} page${r.pages === 1 ? "" : "s"}` + ago(r)
      case "converted": return "Converted · waiting its turn"
      default: return activeLabel(r) + ago(r)
    }
  }
  function activeLabel(r) {
    const n = now.file === r.key && now.phase !== "idle" ? now : null
    if (!n) return r.state === "filing" ? "Filing" : r.state === "applying" ? "Applying" : "Reading"
    switch (n.phase) {
      case "load": return "Waiting for the model to load"
      case "ask": return "Reading" + (n.of > 1 ? ` · part ${n.n} of ${n.of}` : "") + (n.tokens ? ` · ${fmtTokens(n.tokens)} tokens` : "")
      case "check": return "Checking against the wiki" + (n.of ? ` · ${n.n} of ${n.of}` : "")
      case "write": return "Writing pages" + (r.written.size ? ` · ${r.written.size} so far` : "")
      case "file": return r.kind === "packet" ? "Archiving" : "Filing"
      case "apply": return "Applying"
      case "search": return "Looking things up"
      case "think": return "Thinking"
      default: return "Reading"
    }
  }

  // ------------------------------------------------------------------ render
  const labelEls = new Map()
  let renderQueued = false
  function render() {
    if (renderQueued) return
    renderQueued = true
    requestAnimationFrame(() => {
      renderQueued = false
      filesEl.textContent = ""
      labelEls.clear()
      let total = 0, done = 0, aside = 0, ready = 0
      const shown = order.slice(0, 200)
      if (shown.some((k) => rows.get(k) && rows.get(k).kind === "doc")) {
        const legend = document.createElement("li"); legend.className = "legend"; legend.setAttribute("aria-hidden", "true")
        for (const s of DOC_STAGES) { const sp = document.createElement("span"); sp.textContent = s; legend.append(sp) }
        filesEl.append(legend)
      }
      for (const key of shown) {
        const r = rows.get(key)
        if (!r) continue
        const stages = r.kind === "packet" ? PACKET_STAGES : DOC_STAGES
        const li = document.createElement("li")
        const head = document.createElement("div"); head.className = "file-head"
        const nm = document.createElement("span"); nm.className = "file-name"; nm.textContent = r.name
        const st = document.createElement("span")
        st.className = "stage " + (FINAL[r.final] || (r.retry ? "warn" : ""))
        st.textContent = rowLabel(r)
        labelEls.set(key, [st, r])
        head.append(nm, st)
        let [finished, active] = r.final === "failed" || r.final === "skipped" || r.final === "duplicate" ? [0, -1]
          : (PLACE[r.kind][r.state] || [1, -1])
        if (r.final === "parked" || r.retry) active = -1
        const bar = document.createElement("div")
        bar.className = "steps" + ({ ok: " done", warn: " warn", bad: " bad" }[FINAL[r.final]] || (r.retry ? " warn" : ""))
        stages.forEach((name, i) => {
          const s = document.createElement("span")
          s.title = name
          if (i < finished) s.className = "on"
          else if (i === active) {
            s.className = "active"
            if (i === 0) { const fill = document.createElement("i"); fill.style.width = r.pct + "%"; s.append(fill) }
          }
          bar.append(s)
        })
        li.append(head, bar)
        const det = document.createElement("div"); det.className = "detail"
        if (r.size) det.append(fmtSize(r.size) + "  ")
        if (r.note) det.append(r.note + "  ")
        if (r.to) {
          const a = document.createElement("a"); a.href = rawUrl(r.to); a.textContent = "original"; a.target = "_blank"
          det.append(a)
        }
        for (const p of r.links.slice(0, 8)) {
          const a = document.createElement("a"); a.href = pageUrl(p); a.textContent = base(p).replace(/\.md$/, "")
          det.append(a)
        }
        if (det.childNodes.length) li.append(det)
        filesEl.append(li)
        if (r.final !== "skipped" && r.final !== "duplicate") {
          total++
          if (r.final === "filed" || r.final === "applied") done++
          if (r.final === "parked" || r.final === "failed") aside++
          if (r.final === "filed" || r.final === "applied" || RANK[r.state] >= (r.kind === "doc" ? RANK.converted : RANK.reading)) ready++
        }
      }
      // Solid: done. Light: converted and ready to be read. No guessed weights.
      const meter = $("overall-meter")
      const pct = total ? Math.round((done / total) * 100) : 0
      meter.querySelector(".fill").style.width = pct + "%"
      meter.querySelector(".buf").style.width = (total ? Math.round((ready / total) * 100) : 0) + "%"
      meter.className = "meter" + (total && done === total ? " done" : "")
      $("summary").textContent = total
        ? `${done} of ${total} done${aside ? ` · ${aside} set aside` : ""} · ${pct}%` : ""
      renderNow()
    })
  }

  // ------------------------------------------------------------------ live line
  let glyph = 0
  function busy() {
    if (!now.phase || now.phase === "idle") return false
    return runner.running || Date.now() - when(now.t) < 15000
  }
  function nowFacts(n, elapsed) {
    const out = []
    if (n.detail) out.push(n.detail)
    if ((n.phase === "convert" || n.phase === "ocr") && n.n && n.of) out.push(`document ${n.n} of ${n.of}`)
    if (n.phase === "ask" && n.of > 1) out.push(`part ${n.n} of ${n.of}`)
    if (n.phase === "check" && n.n && n.of) out.push(`${n.n} of ${n.of}`)
    if (n.pages) out.push(`${n.pages} page${n.pages === 1 ? "" : "s"}`)
    const b = /^(\d+)\/(\d+)$/.exec(n.batch || "")
    if (b && Number(b[2]) > 1) out.push(`batch ${b[1]} of ${b[2]}`)
    if (n.tokens) out.push(`${fmtTokens(n.tokens)} tokens`)
    out.push(fmtElapsed(elapsed))
    return out.join(" · ")
  }
  function renderNow() {
    if (!busy()) { nowEl.textContent = ""; return }
    const pool = POOLS[now.phase] || POOLS.think
    const elapsed = Date.now() - when(now.since || now.t)
    let seed = 0
    for (const ch of (now.phase + (now.file || ""))) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0
    const verb = reduced ? pool[0] : pool[(seed + Math.floor(elapsed / 4000)) % pool.length]
    const g = document.createElement("span"); g.className = "glyph"; g.textContent = reduced ? "✻" : GLYPHS[glyph % GLYPHS.length]
    const v = document.createElement("span"); v.className = "verb"; v.textContent = verb
    const parts = [g, v]
    if (now.file && WITH_FILE.has(now.phase)) {
      const o = document.createElement("span"); o.className = "obj"; o.textContent = " " + shortName(base(now.file))
      parts.push(o)
    }
    const p = document.createElement("span"); p.className = "paren"; p.textContent = ` (${nowFacts(now, elapsed)})`
    parts.push("…", p)
    nowEl.replaceChildren(...parts)
    nowEl.title = nowEl.textContent
  }
  function onNow(n) {
    if (!n || typeof n !== "object") return
    if (now.t && n.t && when(n.t) < when(now.t)) return
    now = n
    if (n.run) currentRun = n.run
    // The engine is at work: say so now, not at the next status poll.
    if (n.phase && n.phase !== "idle" && !runner.running && Date.now() - when(n.t) < 15000) {
      const st = $("state")
      if (!/^Working/.test(st.textContent)) { st.className = "busy"; st.textContent = "Working" }
    }
    const r = n.file ? rows.get(n.file) : null
    if (r && !r.final) {
      if (n.phase === "convert") setState(r, "converting", n.since)
      else if (n.phase === "ocr") { r.pages = n.pages || r.pages; setState(r, "ocr", n.since) }
      else if (r.kind === "packet" && (n.phase === "write" || n.phase === "file")) setState(r, "applying", n.since)
      else if (n.phase === "file") setState(r, "filing", n.since)
      else if (["load", "read", "ask", "check", "write", "search", "think", "apply"].includes(n.phase)) setState(r, "reading", n.since)
    }
    // Past the conversion step, documents of this run that had nothing to convert are ready.
    if (!["convert", "ocr", "settle", "idle"].includes(n.phase)) {
      for (const x of rows.values()) if (x.state === "waiting-convert" && x.run && x.run === currentRun) setState(x, "converted", n.t)
    }
    render()
  }
  // Once a second: the clocks on the live line and on the files being worked on.
  function tick() {
    renderNow()
    for (const [el, r] of labelEls.values()) {
      if (!r.final && !r.retry && ["converting", "ocr", "reading", "filing", "applying"].includes(r.state)) el.textContent = rowLabel(r)
    }
  }
  setInterval(tick, 1000)
  if (!reduced) setInterval(() => { glyph++; const g = nowEl.querySelector(".glyph"); if (g) g.textContent = GLYPHS[glyph % GLYPHS.length] }, 120)

  // ------------------------------------------------------------------ log
  function logLine(t, text, cls) {
    const atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 8
    const old = t && new Date(t).getTime() < openedAt
    if (!old && !dividerShown && logEl.childNodes.length) {
      const d = document.createElement("div"); d.className = "divider"; d.textContent = "Earlier activity above · live from here"
      logEl.append(d)
    }
    if (!old) dividerShown = true
    const line = document.createElement("div")
    if (old) line.className = "old"
    const ts = document.createElement("span"); ts.className = "t"
    ts.textContent = (t ? t.slice(11, 19) : new Date().toTimeString().slice(0, 8)) + "  "
    const msg = document.createElement("span"); if (cls) msg.className = cls; msg.textContent = text
    line.append(ts, msg)
    logEl.append(line)
    while (logEl.childNodes.length > 2000) logEl.firstChild.remove()
    if (atBottom) logEl.scrollTop = logEl.scrollHeight
  }

  const seenFinal = new Set()
  function onEvent(e) {
    const f = e.file || ""
    const n = base(f)
    switch (e.type) {
      case "upload": {
        // A duplicate names the copy already queued: leave that row's progress alone.
        if (e.duplicate) { logLine(e.t, `${e.name ? base(e.name) : n}: the same file is already queued`, "warn"); break }
        const r = row(f, e.name ? base(e.name) : n)
        r.size = e.bytes || r.size
        setState(r, "queued", e.t); logLine(e.t, `Uploaded ${r.name} (${fmtSize(e.bytes || 0)})`)
        break
      }
      case "waiting": logLine(e.t, "Waiting for files to finish copying…"); break
      case "batch":
        if (e.of > 1) logLine(e.t, `Batch ${e.n} of ${e.of}: ${e.docs} document${e.docs === 1 ? "" : "s"}`)
        break
      case "run-start":
        currentRun = e.run || ""
        logLine(e.t, `Started: ${e.docs || 0} document(s), ${e.packets || 0} packet(s)`); break
      case "queued": {
        // In this run. A file that was waiting for a retry starts over.
        const r = row(f)
        if (r.final) break
        r.run = e.run || currentRun
        if (r.retry) { r.retry = false; setState(r, r.kind === "doc" ? "waiting-convert" : "queued", e.t, true) }
        else setState(r, r.kind === "doc" ? "waiting-convert" : "queued", e.t)
        break
      }
      case "routed": { rekey(f, e.to); logLine(e.t, `Moved ${n} to the ${isPacketPath(e.to) ? "packet" : "document"} queue`); break }
      case "convert": { setState(row(f), "converting", e.t); logLine(e.t, `Converting ${n} to text`); break }
      case "ocr": {
        const r = row(f); r.pages = e.pages || r.pages; setState(r, "ocr", e.t)
        logLine(e.t, `${n} is a scan: reading its ${e.pages ? e.pages + " " : ""}page${e.pages === 1 ? "" : "s"} with OCR`); break
      }
      case "converted": { const r = row(f); if (RANK[r.state] <= RANK.ocr) setState(r, "converted", e.t); break }
      case "claude-start":
        logLine(e.t, e.label && e.label.startsWith("intake") ? "Claude is reading the documents"
          : e.label && e.label.startsWith("ingest") ? "Claude is applying the Update Packets"
          : e.label === "local" ? "The model on this Mac is reading (nothing leaves the Mac)"
          : "Reading (" + (e.label || "engine") + ")"); break
      case "read": { setState(row(f), "reading", e.t); logLine(e.t, `Reading ${n}`); break }
      case "page": {
        if (f) { const r = row(f); r.written.add(e.page); if (!r.links.includes(e.page)) r.links.push(e.page) }
        logLine(e.t, `${e.action === "created" ? "Created" : "Updated"} page ${e.page.replace(/^wiki\//, "")}`); break
      }
      case "review": logLine(e.t, `Noted something for review${n ? " (" + n + ")" : ""}`, "warn"); break
      case "filed": case "applied": {
        const r = row(f)
        r.to = e.to || r.to
        finish(r, e.type, e.t)
        if (!seenFinal.has(e.type + f)) {
          seenFinal.add(e.type + f)
          logLine(e.t, e.type === "filed" ? `Filed ${n} → ${(e.to || "").split("/").slice(0, -1).join("/")}` : `Applied packet ${n}`, "ok")
        }
        break
      }
      case "parked": {
        const r = row(f); r.to = e.to || ""
        finish(r, "parked", e.t)
        r.note = "Could not be processed; see the Review queue"
        logLine(e.t, `${n} could not be processed after ${e.attempts || 2} tries; moved to needs-review`, "warn"); break
      }
      case "retry": {
        const r = row(f); r.note = "Not finished; it will be tried again"
        if (!r.final) r.retry = true
        logLine(e.t, `${n} is not finished yet; it will be tried again`, "warn"); break
      }
      case "claude-end":
        if (e.ok && e.label === "local") logLine(e.t, `Finished reading (${e.turns || 0} questions to the model, ${e.detail || ""})`)
        else if (e.ok) logLine(e.t, `Finished reading (${e.turns || 0} steps${e.cost != null ? ", $" + Number(e.cost).toFixed(2) : ""})`)
        else logLine(e.t, `Reading stopped (${e.detail || "error"})`, "bad")
        break
      case "committed": logLine(e.t, "Saved a version of the wiki"); break
      case "build-start": logLine(e.t, "Updating the website…"); break
      case "build-done": logLine(e.t, "Website updated. Refresh the wiki to see the changes.", "ok"); break
      case "build-failed": logLine(e.t, "The website could not be rebuilt; the previous version is still shown", "bad"); break
      case "run-end": logLine(e.t, `Done: ${e.docs || 0} document(s), ${e.packets || 0} packet(s)`, "ok"); break
      case "rerun": logLine(e.t, `${e.count || "More"} file(s) arrived meanwhile; starting again`); break
      case "error": {
        if (f) { const r = row(f); if (!r.final) { r.retry = true; r.note = e.msg || "" } }
        logLine(e.t, "Problem: " + (e.msg || "unknown"), "bad"); break
      }
      case "process-requested": logLine(e.t, "Process now pressed"); break
      default: if (e.msg) logLine(e.t, e.msg)
    }
    render()
  }

  // ------------------------------------------------------------------ live stream
  // The viewer issues a new token each time it starts (an engine update restarts it).
  // A page holding an old one reloads once to pick up the new one.
  function reloadForNewToken() {
    let last = 0
    try { last = Number(sessionStorage.getItem("upload-reload") || 0) } catch (_) {}
    if (Date.now() - last < 30000) return
    try { sessionStorage.setItem("upload-reload", String(Date.now())) } catch (_) {}
    if (!uploading && !queue.length) location.reload()
  }

  function connect() {
    const es = new EventSource("/api/events?token=" + encodeURIComponent(TOKEN))
    es.onmessage = (m) => { try { onEvent(JSON.parse(m.data)) } catch (_) {} }
    es.addEventListener("now", (m) => { try { onNow(JSON.parse(m.data)) } catch (_) {} })
    es.onerror = () => { if (es.readyState === EventSource.CLOSED) reloadForNewToken() }
  }

  async function poll() {
    try {
      const r = await fetch("/api/status?token=" + encodeURIComponent(TOKEN), { cache: "no-store" })
      if (r.status === 403) reloadForNewToken()
      if (r.ok) {
        const s = await r.json()
        const st = $("state")
        const waiting = s.queue.intake.length + s.queue.inbox.length
        runner = s.runner || { running: false }
        if (runner.running) { st.className = "busy"; st.textContent = "Working" + (runner.since ? " since " + runner.since : "") }
        else if (waiting) { st.className = "busy"; st.textContent = `${waiting} file(s) waiting to start` }
        else { st.className = "idle"; st.textContent = "Idle" }
        $("process").disabled = runner.running || !waiting
        $("limit").textContent = `Up to ${s.maxUploadMb} MB per file.`
        maxBytes = s.maxUploadMb * 1048576
        for (const p of [...s.queue.intake, ...s.queue.inbox]) row(p)  // also files added outside this page
        if (s.now) onNow(s.now)
        render()
      }
    } catch (_) {}
    setTimeout(poll, 4000)
  }

  // ------------------------------------------------------------------ uploads
  const queue = []
  let tempId = 0
  function enqueue(file, relPath) {
    const name = relPath || file.name
    // Hidden files and folders (.DS_Store, .git, .Spotlight-V100) are never documents.
    if (name.split("/").some((seg) => seg.startsWith("."))) return
    const key = "upload:" + (++tempId)
    const r = row(key, base(name))
    r.size = file.size
    if (file.size > maxBytes) {
      finish(r, "skipped")
      r.note = `Larger than the ${Math.round(maxBytes / 1048576)} MB limit`
      render()
      return
    }
    r.state = "uploading"
    r.pct = 0
    queue.push({ file, name, key })
    pump()
    render()
  }
  function pump() {
    while (uploading < 2 && queue.length) send(queue.shift())
  }
  function send({ file, name, key }) {
    uploading++
    const xhr = new XMLHttpRequest()
    xhr.open("POST", "/api/upload?name=" + encodeURIComponent(name))
    xhr.setRequestHeader("X-Wiki-Token", TOKEN)
    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable) { const r = rows.get(key); if (r) { r.pct = Math.round((ev.loaded / ev.total) * 100); render() } }
    }
    xhr.onloadend = () => {
      uploading--
      let res = {}
      try { res = JSON.parse(xhr.responseText || "{}") } catch (_) {}
      const r = rows.get(key)
      if (xhr.status === 200 && res.ok) {
        const merged = rekey(key, res.file)
        if (merged) setState(merged, "queued")
        if (res.duplicate && merged && merged.key === res.file) {
          // Nothing new was queued; the row now tracks the copy that already was.
          merged.note = "The same file was already queued"
        }
      } else if (r) {
        if (res.skipped) { finish(r, "skipped"); r.note = "Skipped: " + res.skipped }
        else { finish(r, "failed"); r.note = res.error || (xhr.status ? "Error " + xhr.status : "Connection lost") }
        logLine(null, `${r.name}: ${r.note}`, res.skipped ? "warn" : "bad")
      }
      render()
      pump()
    }
    xhr.send(file)
  }

  async function walk(entry, prefix, out) {
    if (entry.isFile) {
      await new Promise((ok) => entry.file((f) => { out.push([f, prefix + f.name]); ok() }, ok))
    } else if (entry.isDirectory) {
      const reader = entry.createReader()
      for (;;) {
        const batch = await new Promise((ok) => reader.readEntries(ok, () => ok([])))
        if (!batch.length) break
        for (const child of batch) await walk(child, prefix + entry.name + "/", out)
      }
    }
  }

  const drop = $("drop")
  ;["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over") }))
  ;["dragleave", "drop"].forEach((t) => drop.addEventListener(t, () => drop.classList.remove("over")))
  // A file dropped anywhere else on the page must not make the browser open it.
  window.addEventListener("dragover", (e) => e.preventDefault())
  window.addEventListener("drop", (e) => e.preventDefault())
  drop.addEventListener("drop", async (e) => {
    e.preventDefault()
    const items = [...(e.dataTransfer.items || [])]
    const entries = items.map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean)
    if (entries.length) {
      const found = []
      for (const en of entries) await walk(en, "", found)
      found.forEach(([f, p]) => enqueue(f, p))
    } else {
      [...e.dataTransfer.files].forEach((f) => enqueue(f))
    }
  })
  $("pick").onclick = () => $("file-input").click()
  $("pick-folder").onclick = () => $("folder-input").click()
  $("file-input").onchange = (e) => { [...e.target.files].forEach((f) => enqueue(f)); e.target.value = "" }
  $("folder-input").onchange = (e) => { [...e.target.files].forEach((f) => enqueue(f, f.webkitRelativePath)); e.target.value = "" }
  $("process").onclick = async () => {
    $("process").disabled = true
    try {
      await fetch("/api/process", { method: "POST", headers: { "X-Wiki-Token": TOKEN } })
    } catch (_) {}
  }
  window.addEventListener("beforeunload", (e) => { if (uploading || queue.length) { e.preventDefault(); e.returnValue = "" } })

  connect()
  poll()
  render()
})()
</script>
</body>
</html>
